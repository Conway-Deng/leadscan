name: tests

# The fast unit suite needs no browser, API key or network. A separate job
# proves that a clean runner can install and use real headless Chromium.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests/ -q --ignore=tests/test_browser_integration.py

      # A key must never reach the repository. This fails the build if one does.
      - name: Check no secret was committed
        run: |
          if git grep -nIE 'AIza[0-9A-Za-z_-]{35}' -- . ':!*.yml'; then
            echo "A Google API key looks like it is committed. Rotate it now."
            exit 1
          fi
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo ".env is tracked by git. Remove it and rotate the key."
            exit 1
          fi
          echo "No secret found."

  browser-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run real-browser integration test
        run: python -m pytest tests/test_browser_integration.py -q

  worker-container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build worker container
        run: |
          IMAGE="leadscan-worker-ci:${GITHUB_SHA}"
          docker build \
            --pull \
            --file Dockerfile.worker \
            --tag "$IMAGE" \
            .

      - name: Verify worker image contents
        run: |
          IMAGE="leadscan-worker-ci:${GITHUB_SHA}"

          docker run --rm \
            --entrypoint /bin/sh \
            "$IMAGE" \
            -c '
              set -eu

              id pwuser >/dev/null
              command -v gosu >/dev/null
              command -v iptables >/dev/null
              command -v ip6tables >/dev/null

              test -x /app/deploy/fly/apply-egress-firewall.sh
              test -x /app/deploy/fly/start-worker.sh

              test ! -e /app/tests
              test ! -e /app/site
              test ! -e /app/.git
              test ! -e /app/.env
              test ! -e /app/netlify.toml
            '

          docker run --rm \
            --entrypoint python \
            "$IMAGE" \
            -c 'import importlib.metadata as m; assert m.version("playwright") == "1.62.0"'

      - name: Verify worker entrypoint
        run: |
          IMAGE="leadscan-worker-ci:${GITHUB_SHA}"

          ENTRYPOINT="$(docker image inspect \
            --format '{{json .Config.Entrypoint}}' \
            "$IMAGE")"

          echo "entrypoint=$ENTRYPOINT"

          test "$ENTRYPOINT" = '["/app/deploy/fly/start-worker.sh"]'

      - name: Launch Chromium as pwuser
        run: |
          IMAGE="leadscan-worker-ci:${GITHUB_SHA}"

          docker run --rm \
            --ipc=host \
            --user pwuser:pwuser \
            --env HOME=/home/pwuser \
            --entrypoint python \
            "$IMAGE" \
            -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); browser = p.chromium.launch(headless=True); page = browser.new_page(); page.set_content("<title>LeadScan Worker CI</title>"); assert page.title() == "LeadScan Worker CI"; browser.close(); p.stop(); print("non_root_chromium=PASS")'
