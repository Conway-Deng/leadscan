name: tests

# The test suite needs no browser, no API key and no network, so it runs in
# about a second and can gate every push.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests/ -q

      # A key must never reach the repository. This fails the build if one does.
      - name: Check no secret was committed
        run: |
          if git grep -nIE 'AIza[0-9A-Za-z_-]{35}' -- . ':!*.yml'; then
            echo "A Google API key looks like it is committed. Rotate it now."
            exit 1
          fi
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo ".env is tracked by git. Remove it and rotate the key."
            exit 1
          fi
          echo "No secret found."
