# Fly.io configuration for LeadScan worker
# Note: "app = ..." is omitted intentionally; app name is configured during fly launch/deploy.

primary_region = "sin"

kill_signal = "SIGTERM"
kill_timeout = 120

[build]
  dockerfile = "Dockerfile.worker"

[env]
  LEADSCAN_LEAD_DB_PATH = "/data/leadscan-public-leads.sqlite3"

# Persistent volume for public lead SQLite database.
# Operational Constraints:
# 1. 'leadscan_data' volume must be provisioned in the same region (sin) before deployment.
# 2. SQLite storage requires running exactly one Machine; Fly volumes are per-Machine and not replicated.
# 3. This repository configuration does not provision the volume.
[mounts]
  source = "leadscan_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[http_service.concurrency]
  type = "requests"
  soft_limit = 2
  hard_limit = 8

[http_service.http_options]
  idle_timeout = 600

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
  persist_rootfs = "never"
