[build]
  publish = "site"

# ---------------------------------------------------------------------------
# Production Deployment Notes for Independent Worker Wiring:
# ---------------------------------------------------------------------------
# Production wiring for the independently hosted worker:
# 1. site/index.html meta tag 'leadscan-api-origin' uses the exact HTTPS
#    origin of the worker service.
# 2. connect-src below uses the SAME exact HTTPS worker origin.
# 3. Separately configure the worker's LEADSCAN_ALLOWED_ORIGIN environment
#    variable to match this public Netlify site's exact HTTPS origin.
# Note: This repository contains the production worker hostname, but no secrets.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"

  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://leadscan-9fsy.onrender.com; img-src 'self' data:; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
